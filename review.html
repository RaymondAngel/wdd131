<!DOCTYPE html>
<html lang="en-US">
<head>

    <title>Review Submitted</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <footer>
        <p>&copy;<span id="currentyear"></span> Raymond Amande | Philippines</p>
