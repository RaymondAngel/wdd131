<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review and rate your experience.">
    <meta name="author" content="Raymond Amande">
    <title>Product Review Form</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>
<body>
    <header><h1>Product Review</h1></header>
    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name <span class="required" aria-hidden="true">*</span></label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset class="rating-group">
                <legend>Overall Rating <span class="required" aria-hidden="true">*</span></legend>
                <div class="stars">
                    <div class="rating-option"><label for="rating1"><span aria-hidden="true">☆</span><small>1</small></label><input type="radio" id="rating1" name="rating" value="1" required></div>
                    <div class="rating-option"><label for="rating2"><span aria-hidden="true">☆</span><small>2</small></label><input type="radio" id="rating2" name="rating" value="2" required></div>
                    <div class="rating-option"><label for="rating3"><span aria-hidden="true">☆</span><small>3</small></label><input type="radio" id="rating3" name="rating" value="3" required></div>
                    <div class="rating-option"><label for="rating4"><span aria-hidden="true">☆</span><small>4</small></label><input type="radio" id="rating4" name="rating" value="4" required></div>
                    <div class="rating-option"><label for="rating5"><span aria-hidden="true">☆</span><small>5</small></label><input type="radio" id="rating5" name="rating" value="5" required></div>
                </div>
            </fieldset>

            <label for="install-date">Date of Installation <span class="required" aria-hidden="true">*</span></label>
            <input type="date" id="install-date" name="install-date" required>

            <fieldset class="features">
                <legend>Which features did you find useful?</legend>
                <p class="hint">Check all that apply.</p>
                <label><input type="checkbox" id="durability" name="features" value="durability"> Durability</label>
                <label><input type="checkbox" id="ease-of-use" name="features" value="ease-of-use"> Ease of Use</label>
                <label><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
                <label><input type="checkbox" id="design" name="features" value="design"> Design</label>
            </fieldset>

            <label for="review">Written Review <span class="optional">(Optional)</span></label>
            <textarea id="review" name="review" rows="6"></textarea>

            <label for="username">Your Name <span class="optional">(Optional)</span></label>
            <input type="text" id="username" name="username" autocomplete="name">

            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> Raymond Amande | Philippines</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
